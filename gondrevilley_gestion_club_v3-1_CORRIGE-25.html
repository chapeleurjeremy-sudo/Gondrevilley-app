<style>
:root{--blue:#0757b8;--dark:#063b82}
body{background:#f5f8fc}
.side{background:linear-gradient(180deg,#0757b8,#063b82);width:235px}
.logo{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4px 8px 18px}
.logo img{width:142px;height:142px;object-fit:contain;border-radius:8px;background:#fff;margin-bottom:10px}
.logo .club-name{font-size:15px;font-weight:700}.logo .slogan{font-size:11px;margin-top:6px;color:#fff;font-style:italic}
.nav button.active,.nav button:hover{background:rgba(255,255,255,.18)}
.card{border:1px solid #e0e9f4}.btn{background:var(--blue)}.top h1{color:var(--dark)}
.club-header{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:18px;border:1px solid #e0e9f4}
.club-header strong{font-size:19px;color:var(--dark)}.club-header .slogan{font-size:12px;color:var(--blue);font-style:italic;margin-top:3px}
@media(max-width:800px){.side{width:68px}.logo img{width:48px;height:48px}.logo .club-name,.logo .slogan{display:none}}
</style>

<style>
.modal-bg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto}
.modal h2{margin-top:0}
.rolechips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.rolechip{padding:6px 12px;border-radius:20px;border:1px solid #d9e0e5;cursor:pointer;font-size:13px;user-select:none}
.rolechip.active{background:#14202b;color:#fff;border-color:#14202b}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;margin-right:4px;background:#eef2f6;color:#465667}
.badge.player{background:#e6f2ff;color:#0757b8}
.badge.educator{background:#eafaf0;color:#1a9c56}
.badge.board{background:#fff4e0;color:#b5720a}
.badge.referee{background:#f3e9ff;color:#6b2fb3}
.fieldset-box{border:1px solid #e3e8ec;border-radius:10px;padding:12px;margin-top:10px;background:#fafbfc}
.chk-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.chk-row input{width:auto}
</style>

/* ============================= STOCKAGE (fiable, avec secours local) ============================= */
const MEM = {};
let storageAvailable = null;
let backendOk = null;
const urlParams = new URLSearchParams(window.location.search);
const ORIGINAL_SHELL_HTML = document.body.innerHTML;
let BACKEND_URL = urlParams.get('backend') || (function(){ try{ return localStorage.getItem('gd_backend_url') || ''; }catch(e){ return ''; } })();
let PUBLIC_URL = (function(){ try{ return localStorage.getItem('gd_public_url') || ''; }catch(e){ return ''; } })();
function memKey(key, shared){ return (shared?'S:':'P:')+key; }

async function backendCall(action, params, body){
  const url = new URL(BACKEND_URL);
  url.searchParams.set('action', action);
  Object.keys(params||{}).forEach(k=>url.searchParams.set(k, params[k]));
  const opts = body ? {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body)} : {method:'GET'};
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 15000); // marge large : premier appel après inactivité (cold start) peut être lent
  try{
    const res = await fetch(url.toString(), Object.assign({signal: ctrl.signal}, opts));
    if(!res.ok) throw new Error('backend http '+res.status);
    return await res.json();
  } finally {
    clearTimeout(timer);
  }
}
let lastBackendError = '';
async function testBackend(){
  if(!BACKEND_URL){ backendOk = null; lastBackendError=''; return; }
  const results = await Promise.allSettled([
    backendCall('get', {key:'__healthcheck__'}),
    backendCall('set', {}, {key:'__healthcheck__', value: JSON.stringify({ok:true})})
  ]);
  const [getRes, setRes] = results;
  const describe = (r) => {
    if(r.status==='fulfilled') return 'OK';
    const e = r.reason;
    return (e && e.name==='AbortError') ? 'délai dépassé' : String(e && e.message || e);
  };
  const getOk = getRes.status==='fulfilled';
  const setOk = setRes.status==='fulfilled';
  backendOk = getOk && setOk;
  if(backendOk){ lastBackendError=''; }
  else { lastBackendError = `Lecture (GET) : ${describe(getRes)} · Écriture (POST) : ${describe(setRes)}`; }
}
async function testStorageAvailability(){
  try{
    if(!window.storage) throw new Error('no window.storage');
    await window.storage.set('__healthcheck__', JSON.stringify({ok:true, t:Date.now()}), true);
    const r = await window.storage.get('__healthcheck__', true);
    storageAvailable = !!(r && JSON.parse(r.value).ok===true);
  }catch(e){ storageAvailable = false; }
}
async function sGet(key, shared){
  const mk = memKey(key, shared);
  if(BACKEND_URL && backendOk && shared){
    try{ const r = await backendCall('get', {key}); if(r && r.value!=null){ MEM[mk]=JSON.parse(r.value); return MEM[mk]; } return (mk in MEM)?MEM[mk]:null; }
    catch(e){ return (mk in MEM) ? MEM[mk] : null; }
  }
  if(storageAvailable){
    try{
      const r = await window.storage.get(key, !!shared);
      if(r){ MEM[mk] = JSON.parse(r.value); return MEM[mk]; }
      return (mk in MEM) ? MEM[mk] : null;
    }catch(e){ return (mk in MEM) ? MEM[mk] : null; }
  }
  return (mk in MEM) ? MEM[mk] : null;
}
async function sSet(key, value, shared){
  const mk = memKey(key, shared);
  MEM[mk] = value;
  if(BACKEND_URL && backendOk && shared){
    try{ await backendCall('set', {}, {key, value: JSON.stringify(value)}); return true; }catch(e){ return false; }
  }
  if(storageAvailable){
    try{ await window.storage.set(key, JSON.stringify(value), !!shared); return true; }catch(e){ return false; }
  }
  return true;
}

function nextWeekday(target){
  // renvoie une date ISO (aaaa-mm-jj) tombant sur le prochain jour de semaine "target" (0=dimanche..6=samedi)
  const d = new Date();
  const diff = (target - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + (diff===0?7:diff));
  return d.toISOString().slice(0,10);
}

async function getDB(){
  let db = await sGet('club_db', true);
  if(!db){ db = defaultDB(); await sSet('club_db', db, true); }
  // migrations douces pour compat si champs manquants
  db.settings = db.settings || { enabledTabs:{} };
  db.settings.enabledTabs = Object.assign({teams:true,players:true,educators:true,referees:true,board:true,tests:true,planning:true,tasks:true,com:true}, db.settings.enabledTabs||{});
  if(!db.settings.adminPin) db.settings.adminPin = '0000';
  db.events = db.events || []; db.tasks = db.tasks || []; db.news = db.news || [];
  db.members.forEach(m=>{
    if(m.accessStatus===undefined) m.accessStatus = 'approved';
    if(m.accessCode===undefined) m.accessCode = null;
  });
  db.events.forEach(e=>{ if(e.createdBy===undefined) e.createdBy = 'admin'; });
  const LEGACY_CATEGORY_MAP = {
    'U6':'U6/U7','U7':'U6/U7','U8':'U8/U9','U9':'U8/U9','U10':'U10/U11','U11':'U10/U11',
    'U12':'U12/U13','U13':'U12/U13','U14':'U14/U15','U15':'U14/U15','U16':'U16/U17','U17':'U16/U17',
    'U18':'U18/U19','U19':'U18/U19','Seniors':'Senior'
  };
  (db.teams||[]).forEach(t=>{ if(LEGACY_CATEGORY_MAP[t.category]) t.category = LEGACY_CATEGORY_MAP[t.category]; });
  // migration du système de tests : VMA seule → types de tests génériques
  db.testTypes = db.testTypes && db.testTypes.length ? db.testTypes : [{id:'vma', name:'VMA', unit:'km/h'}];
  if(!db.testTypes.some(tt=>tt.id==='vma')) db.testTypes.unshift({id:'vma', name:'VMA', unit:'km/h'});
  db.members.forEach(m=>{
    if(!m.isPlayer || !m.player) return;
    if(!m.player.testResults) m.player.testResults = {};
    if(!m.player.testResults.vma){
      if(m.player.vmaHistory && m.player.vmaHistory.length){
        m.player.testResults.vma = m.player.vmaHistory.map(h=>({date:h.date, value:h.value}));
      } else if(m.player.vma){
        m.player.testResults.vma = [{date: todayISO(), value: parseFloat(m.player.vma)}];
      }
    }
  });
  return db;
}

async function loginWithCode(code){
  code = (code||'').trim();
  if(!code){ toast('Entrez un code.'); return false; }
  if(code === S.db.settings.adminPin){
    S.currentUser = {type:'admin'};
    await sSet('session', {type:'admin'}, false);
    return true;
  }
  const m = S.db.members.find(x=>x.accessCode && x.accessCode===code);
  if(!m){ toast('Code invalide.'); return false; }
  if(m.accessStatus!=='approved'){ toast('Votre demande n\'a pas encore été validée par le directeur sportif.'); return false; }
  S.currentUser = {type:'member', member:m};
  await sSet('session', {type:'member', memberId:m.id}, false);
  return true;
}
async function tryRestoreSession(){
  const sess = await sGet('session', false);
  if(!sess) return false;
  if(sess.type==='admin'){ S.currentUser = {type:'admin'}; return true; }
  if(sess.type==='member'){
    const m = S.db.members.find(x=>x.id===sess.memberId);
    if(m && m.accessStatus==='approved'){ S.currentUser = {type:'member', member:m}; return true; }
  }
  return false;
}
async function logout(){
  S.currentUser = null;
  await sSet('session', null, false);
  renderLoginGate();
}

/* ============================= CALCULS ============================= */
function players(){ return S.db.members.filter(m=>m.isPlayer); }
function educators(){ return S.db.members.filter(m=>m.isEducator); }
function boardMembers(){ return S.db.members.filter(m=>m.isBoard); }
function referees(){ return S.db.members.filter(m=>m.isReferee); }
function teamByName(n){ return S.db.teams.find(t=>t.name===n); }
function playersOfTeam(n){ return players().filter(p=>p.player.team===n); }
function teamsOfCategory(cat){ return S.db.teams.filter(t=>t.category===cat); }
function playersOfCategory(cat){
  const names = teamsOfCategory(cat).map(t=>t.name);
  return players().filter(p=>names.includes(p.player.team));
}
function eventRoster(e){
  const base = e.scope==='category' ? playersOfCategory(e.category) : playersOfTeam(e.team);
  const guestIds = e.guestPlayerIds || [];
  if(!guestIds.length) return base;
  const baseIds = new Set(base.map(p=>p.id));
  const guests = guestIds.map(id=>S.db.members.find(m=>m.id===id)).filter(p=>p && p.isPlayer && !baseIds.has(p.id));
  return base.concat(guests);
}
function isGuestInEvent(e, playerId){ return (e.guestPlayerIds||[]).includes(playerId); }
function eventLabel(e){ return e.scope==='category' ? `Catégorie ${e.category} (toutes équipes)` : (e.team||'Équipe non définie'); }
function eventMatchesRoster(e, teamName){
  if(e.scope==='category'){ const t = teamByName(teamName); return !!(t && t.category===e.category); }
  return e.team===teamName;
}
const POLE_ORDER = ['École de football','Formation','Pôle Senior'];
function ageOfCategory(cat){
  if(!cat) return 999;
  if(/^baby/i.test(cat)) return 5;
  const m=/^U(\d+)/.exec(cat);
  return m?parseInt(m[1]):999;
}
function poleForCategory(cat){
  if(/^baby/i.test(cat||'')) return 'École de football';
  const n = ageOfCategory(cat);
  if(n<=13) return 'École de football';
  if(n<=17) return 'Formation';
  return 'Pôle Senior'; // U18/U19, Senior, Vétéran, Senior F...
}
function teamsGroupedByPole(){
  return POLE_ORDER.map(pole=>({
    pole,
    teams: S.db.teams.filter(t=>poleForCategory(t.category)===pole).sort((a,b)=>ageOfCategory(a.category)-ageOfCategory(b.category))
  })).filter(g=>g.teams.length);
}
function teamPresence(n){ const ps=playersOfTeam(n); if(!ps.length) return 0; return Math.round(ps.reduce((a,p)=>a+p.player.pres,0)/ps.length); }
function teamStars(n){ return playersOfTeam(n).reduce((a,p)=>a+p.player.stars,0); }
function teamStatus(pres){ return pres>=88?'good':pres>=78?'warn':'bad'; }
function statusDot(s){ return s==='good'?'🟢':s==='warn'?'🟠':'🔴'; }
function educatorsOfTeam(n){ return educators().filter(e=>(e.educator.teams||[]).includes(n)); }
function memberRoleBadges(m){
  let h='';
  if(m.isPlayer) h+=`<span class="badge player">Joueur</span>`;
  if(m.isEducator) h+=`<span class="badge educator">Éducateur</span>`;
  if(m.isBoard) h+=`<span class="badge board">Dirigeant</span>`;
  if(m.isReferee) h+=`<span class="badge referee">Arbitre</span>`;
  return h||'<span class="badge">Membre</span>';
}
function upcomingWeekendEvents(){
  const d = new Date(); const day = d.getDay();
  const satOffset = (6-day+7)%7, sunOffset=(0-day+7)%7;
  const sat = new Date(d); sat.setDate(d.getDate()+(day===6?0:satOffset));
  const sun = new Date(d); sun.setDate(d.getDate()+(day===0?0:(satOffset+1)));
  const inRange = iso => { const x=new Date(iso); return x>=stripTime(day===6?d:sat) && x<=stripTime(day===0?d:sun); };
  function stripTime(x){ const y=new Date(x); y.setHours(0,0,0,0); return y; }
  return S.db.events.filter(e=>inRange(e.date)).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
}
function fmtDateFr(iso){ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function weekdayFr(iso){ return ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'][new Date(iso+'T12:00:00').getDay()]; }

/* ============================= TESTS PHYSIQUES (multi-tests) ============================= */
let selectedTestType = null;
function testTypeLatest(p, testId){
  const arr = p.player.testResults && p.player.testResults[testId];
  if(!arr || !arr.length) return null;
  return arr[arr.length-1];
}
function testsPage(){
  const types = S.db.testTypes && S.db.testTypes.length ? S.db.testTypes : [{id:'vma', name:'VMA', unit:'km/h'}];
  if(!selectedTestType || !types.some(t=>t.id===selectedTestType)) selectedTestType = types[0].id;
  const type = types.find(t=>t.id===selectedTestType) || types[0];
  mainHTML(shell('Tests physiques', 'Suivi des tests de la saison') + `
  <div class="tabs">
    ${types.map(t=>`<button class="${t.id===selectedTestType?'active':''}" onclick="selectTestType('${t.id}')">${escapeHtml(t.name)}</button>`).join('')}
    ${isAdmin()?`<button class="btn secondary" onclick="openTestTypeManager()">⚙️ Gérer les types de tests</button>`:''}
  </div>
  <div class="card">${players().map(p=>{
    const last = testTypeLatest(p, type.id);
    return `<div class="row"><div><b>${escapeHtml(fullName(p))}</b><div class="muted">${last?'Dernier test · '+fmtDateFr(last.date):'Aucun test enregistré'}</div></div><span style="display:flex;align-items:center;gap:8px;"><b>${last?last.value:'—'}${type.unit?' '+escapeHtml(type.unit):''}</b>${canManageTests(p)?`<button class="btn secondary" onclick="addTestResult('${p.id}','${type.id}')">+ Nouveau test</button>`:''}</span></div>`;
  }).join('') || '<div class="muted">Aucun joueur.</div>'}</div>`);
}
function selectTestType(id){ selectedTestType = id; testsPage(); }
async function addTestResult(playerId, testId){
  const p = S.db.members.find(x=>x.id===playerId); if(!p) return;
  if(!canManageTests(p)){ toast('Action réservée à l\'éducateur de cette équipe.'); return; }
  const type = S.db.testTypes.find(t=>t.id===testId); if(!type) return;
  const last = testTypeLatest(p, testId);
  const val = prompt(`Nouveau résultat "${type.name}" pour ${fullName(p)}${type.unit?' ('+type.unit+')':''} :`, last?last.value:'');
  if(val===null) return;
  const num = parseFloat(val.replace(',','.'));
  if(isNaN(num)){ toast('Valeur invalide.'); return; }
  p.player.testResults = p.player.testResults || {};
  p.player.testResults[testId] = p.player.testResults[testId] || [];
  p.player.testResults[testId].push({date: todayISO(), value: num});
  await saveDB();
  toast(`Test « ${type.name} » enregistré.`);
  testsPage();
}

  if(!isAdmin()){ toast('Réservé à l\'administration.'); return; }
  S.modal = {type:'testTypes'};
  renderModal();
}

async function addTestType(){

function planningPage(){

  const upcoming = S.db.events.filter(e=>e.date>=today);
  const pastCount = S.db.events.length - upcoming.length;
  const sorted = upcoming.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
  const byDate = {};
  sorted.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });
  mainHTML(shell('Planning', 'Entraînements et matchs à venir') + `
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
    ${canAddEvent()?`<button class="btn" onclick="openEventModal(null)">+ Ajouter un événement</button>`:''}

}
function planningArchivePage(){
  const today = todayISO();
  const past = S.db.events.filter(e=>e.date<today).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.time.localeCompare(a.time));
  const byDate = {};
  past.forEach(e=>{ (byDate[e.date] = byDate[e.date]||[]).push(e); });

      ${(e.trialGuests||[]).length ? '<hr style="border:none;border-top:1px solid #edf0f2;margin:10px 0;">' + (e.trialGuests||[]).map((tg,idx)=>`<label><input type="checkbox" data-idx="${idx}" class="ev-pres-trial" ${tg.present!==false?'checked':''} ${canManage?'':'disabled'}> ${escapeHtml(tg.name)} <span class="pill">à l'essai</span> ${canManage?`<button type="button" class="btn secondary" style="padding:2px 8px;margin-left:6px;" onclick="removeTrialGuest('${e.id}',${idx})">✕</button>`:''}</label>`).join('') : ''}

function setEventBehavior(id, b){ const e=S.db.events.find(x=>x.id===id); if(!e || !canEditEvent(e)) return; e.behavior=b; eventDetail(id); }

async function addTrialGuest(eventId){
  const e = S.db.events.find(x=>x.id===eventId); if(!e || !canEditEvent(e)){ toast('Action non autorisée.'); return; }
  const input = document.getElementById('ev-trial-name');
  const name = input.value.trim();
  if(!name){ toast('Entrez un prénom.'); return; }
  e.trialGuests = e.trialGuests || [];
  e.trialGuests.push({name, present:true});
  await saveDB();
  toast(`${name} ajouté(e) aux présents.`);
  eventDetail(eventId);
}
async function removeTrialGuest(eventId, idx){
  const e = S.db.events.find(x=>x.id===eventId); if(!e || !canEditEvent(e)){ toast('Action non autorisée.'); return; }
  e.trialGuests = (e.trialGuests||[]).filter((_,i)=>i!==idx);
  await saveDB();
  eventDetail(eventId);
}
async function addGuestToEvent(eventId, playerId){
  const e = S.db.events.find(x=>x.id===eventId); if(!e || !canEditEvent(e)){ toast('Action non autorisée.'); return; }
  e.guestPlayerIds = e.guestPlayerIds || [];
  if(!e.guestPlayerIds.includes(playerId)) e.guestPlayerIds.push(playerId);
  if(e.presence[playerId]===undefined) e.presence[playerId] = true;
  await saveDB();
  toast('Joueur ajouté à la séance.');
  S.modal = {type:'addGuest', eventId, search: S.modal && S.modal.search || ''};
  renderModal();
  eventDetail(eventId);
}
async function removeGuestFromEvent(eventId, playerId){
  const e = S.db.events.find(x=>x.id===eventId); if(!e || !canEditEvent(e)){ toast('Action non autorisée.'); return; }
  e.guestPlayerIds = (e.guestPlayerIds||[]).filter(id=>id!==playerId);
  delete e.presence[playerId];
  e.mvpIds = (e.mvpIds||[]).filter(id=>id!==playerId);
  await saveDB();
  toast('Joueur retiré de la séance.');
  eventDetail(eventId);
}
async function saveEvent(id){
  const e = S.db.events.find(x=>x.id===id); if(!e) return;
  if(!canEditEvent(e)){ toast('Action non autorisée.'); return; }
  document.querySelectorAll('.ev-pres').forEach(cb=>{ e.presence[cb.dataset.pid] = cb.checked; });
  document.querySelectorAll('.ev-pres-trial').forEach(cb=>{ const i=parseInt(cb.dataset.idx); if(e.trialGuests && e.trialGuests[i]) e.trialGuests[i].present = cb.checked; });
  const mvps = Array.from(document.querySelectorAll('.ev-mvp:checked')).map(cb=>cb.dataset.pid).slice(0,2);
  e.mvpIds = mvps;
  const noteEl = document.getElementById('ev-note'); if(noteEl) e.note = noteEl.value;
  const scoreEl = document.getElementById('ev-score'); if(scoreEl) e.score = scoreEl.value;
  const incEl = document.getElementById('ev-incident'); if(incEl) e.incident = incEl.value==='Aucun'?'':incEl.value;
  // recalcul simple de la présence % pour les joueurs concernés (équipe ou catégorie)
  const roster = eventRoster(e);
  roster.forEach(p=>{
    const events = S.db.events.filter(x=>eventMatchesRoster(x, p.player.team) && Object.prototype.hasOwnProperty.call(x.presence,p.id));
    if(events.length){ const present = events.filter(x=>x.presence[p.id]).length; p.player.pres = Math.round(100*present/events.length); }
  });
  mvps.forEach(pid=>{ const p=S.db.members.find(m=>m.id===pid); if(p) p.player.stars = (p.player.stars||0)+1; });
  await saveDB();
  toast(e.type==='match' ? 'Match enregistré.' : 'Entraînement enregistré.');
  if(e.date<todayISO()) planningArchivePage(); else go('planning');
}
async function deleteEvent(id){
  const ev = S.db.events.find(x=>x.id===id);
  if(!ev || !canDeleteEvent(ev)){ toast('Action non autorisée.'); return; }
  if(!confirm('Supprimer cette séance ?')) return;
  const wasPast = ev.date<todayISO();
  S.db.events = S.db.events.filter(x=>x.id!==id);
  await saveDB();
  if(wasPast) planningArchivePage(); else go('planning');
}
async function deleteEventSeries(groupId){
  const sample = S.db.events.find(x=>x.recurringGroupId===groupId);
  if(!sample || !canDeleteEvent(sample)){ toast('Action non autorisée.'); return; }
  if(!confirm('Supprimer TOUTE la série de séances récurrentes (passées et à venir) ?')) return;
  S.db.events = S.db.events.filter(x=>x.recurringGroupId!==groupId);
  await saveDB(); toast('Série supprimée.'); go('planning');
}

async function submitPublicForm(role){
  const g = id => document.getElementById(id);
  const first = g('pf-first').value.trim();
  const last = g('pf-last').value.trim();
  if(!first || !last){ toast('Prénom et nom sont obligatoires.'); return; }
  if(role==='player'){
    const teamPreset = g('pf-team');
    const catSelect = g('pf-cat');
    const hasTeam = teamPreset && teamPreset.value.trim();
    const hasCat = catSelect && catSelect.value;
    if(!hasTeam && !hasCat){ toast('Merci de choisir une catégorie.'); return; }
  }
  const phone = g('pf-phone') ? g('pf-phone').value.trim() : '';
  const email = g('pf-email') ? g('pf-email').value.trim() : '';
  const member = {
    id: genId('mem'), first, last, phone, email,
    isPlayer:false, isEducator:false, isBoard:false, isReferee:false,
    player:null, educator:null, board:null, referee:null,
  };
  if(role==='player'){
    member.isPlayer = true;
    const teamPreset = g('pf-team');
    const catSelect = g('pf-cat');
    member.player = {
      dob: g('pf-dob').value, sex: g('pf-sex').value,
      height: parseFloat(g('pf-height').value)||null, weight: parseFloat(g('pf-weight').value)||null,
      foot: g('pf-foot').value, posMain: g('pf-pos').value, posSecondary:'',
      team: teamPreset ? teamPreset.value.trim() : '',
      category: catSelect ? catSelect.value : '',
      testResults:{}, stars:0, pres:0,
      profileComplete:true, injured:false, injuryNote:''
    };
  } else if(role==='educator'){
    member.isEducator = true;
    const diplomas = Array.from(document.querySelectorAll('.pf-dipl-chk:checked')).map(cb=>cb.value);
    const otherIdx = diplomas.indexOf('Autre');
    if(otherIdx!==-1){
      const other = (g('pf-dipl-other') ? g('pf-dipl-other').value.trim() : '');
      if(other) diplomas[otherIdx] = other; else diplomas.splice(otherIdx,1);
    }
    member.educator = {
      teams: Array.from(document.querySelectorAll('.pf-team-chk:checked')).map(cb=>cb.value),
      role: g('pf-role').value,
      diplomas,
      diplomaDate: g('pf-dipldate').value, trainingNote:''
    };
  } else if(role==='board'){
    member.isBoard = true;
    member.board = { function: g('pf-func').value };
  } else if(role==='referee'){
    member.isReferee = true;
    member.referee = { matchCount: 0 };
  } else {
    toast('Lien invalide.'); return;
  }
  S.db.members.push(member);
  await saveDB();
  document.body.innerHTML = `<div style="max-width:480px;margin:80px auto;text-align:center;font-family:Arial,sans-serif;padding:0 16px;">
    <div style="font-size:44px;">✅</div>
    <h2>Merci ${escapeHtml(first)} !</h2>
    <p style="color:#687681;">Votre fiche a bien été transmise au club de ${escapeHtml(S.db.clubName)}.</p>
  </div>`;
}

function parseFootclubsDate(d){
  // "01/11/2026" -> "2026-11-01"
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(String(d||'').trim());
  if(!m) return null;
  return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
}
function parseFootclubsTime(t){
  // "14H30" -> "14:30", "15H" -> "15:00"
  const m = /^(\d{1,2})H(\d{2})?$/i.exec(String(t||'').trim());
  if(!m) return '00:00';
  return `${m[1].padStart(2,'0')}:${(m[2]||'00').padStart(2,'0')}`;
}
async function importFootclubsFile(){
  const teamSel = document.getElementById('fc-team');
  const fileInput = document.getElementById('fc-file');
  const resultEl = document.getElementById('fc-result');
  if(!teamSel || !teamSel.value){ toast('Sélectionnez une équipe.'); return; }
  if(!fileInput.files || !fileInput.files[0]){ toast('Choisissez un fichier.'); return; }
  if(typeof XLSX === 'undefined'){ toast('Le lecteur de fichiers Excel n\'a pas pu se charger (vérifiez votre connexion internet).'); return; }
  const teamName = teamSel.value;
  const file = fileInput.files[0];
  resultEl.innerHTML = `<div class="muted" style="margin-top:8px;">Lecture du fichier…</div>`;
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:false, defval:''});
    if(!rows.length || rows.length<2){ resultEl.innerHTML = `<div class="notice" style="background:#fde7e7;color:#8a1f1f;margin-top:8px;">Fichier vide ou format non reconnu.</div>`; return; }
    // repère les colonnes par leur en-tête (robuste si l'ordre change un peu)
    const header = rows[0].map(h=>String(h||'').trim().toLowerCase());
    const col = (label) => header.findIndex(h=>h.includes(label));
    const cDate = col('date du match'), cHeure = col('heure du match'), cRV = col('recevant-visiteur'),
          cClubAdv = col('club adverse'), cInstall = col("nom de l'installation"), cLocInstall = col('localité installation');
    if(cDate===-1 || cHeure===-1){ resultEl.innerHTML = `<div class="notice" style="background:#fde7e7;color:#8a1f1f;margin-top:8px;">Colonnes attendues introuvables — ce fichier ne ressemble pas à un export FootClubs standard.</div>`; return; }

    let created=0, skipped=0, errors=0;
    for(let i=1;i<rows.length;i++){
      const r = rows[i];
      if(!r || !r[cDate]) continue;
      const date = parseFootclubsDate(r[cDate]);
      const time = parseFootclubsTime(r[cHeure]);
      if(!date){ errors++; continue; }
      const recevant = cRV!==-1 && String(r[cRV]||'').toLowerCase().startsWith('rec');
      const opponent = cClubAdv!==-1 ? String(r[cClubAdv]||'').trim() : '';
      const location = [cInstall!==-1?r[cInstall]:'', cLocInstall!==-1?r[cLocInstall]:''].filter(Boolean).join(' — ');
      // évite les doublons si on réimporte le même fichier (ou une version mise à jour)
      const exists = S.db.events.some(e=>e.type==='match' && e.team===teamName && e.date===date && e.time===time);
      if(exists){ skipped++; continue; }
      S.db.events.push({
        id: genId('evt'), type:'match', scope:'team', team: teamName, category:'', date, time,
        location, opponent, score:'', presence:{}, mvpIds:[], behavior:'', note:'', incident:'',
        recurringGroupId:null, source:'footclubs', recevant
      });
      created++;
    }
    await saveDB();
    resultEl.innerHTML = `<div class="notice" style="margin-top:8px;">✓ ${created} match(s) importé(s) pour ${escapeHtml(teamName)}${skipped?`, ${skipped} déjà présent(s) ignoré(s)`:''}${errors?`, ${errors} ligne(s) illisible(s)`:''}.</div>`;
    toast(`${created} matchs importés.`);
    fileInput.value = '';
    adminPage();
  }catch(err){
    resultEl.innerHTML = `<div class="notice" style="background:#fde7e7;color:#8a1f1f;margin-top:8px;">Erreur lors de la lecture : ${escapeHtml(String(err.message||err))}</div>`;
  }
}

function openMemberModal(id, presetRole){
  let member, mode;
  if(id){
    member = JSON.parse(JSON.stringify(S.db.members.find(m=>m.id===id)));
    if(!member){ return; }
    mode = canEditMemberFull(member) ? 'full' : (canEditOwnProfile(member) ? 'own' : (canEditAsEducator(member) ? 'limited' : 'readonly'));
  } else {
    if(!canAddMember()){ toast("Action réservée au directeur sportif."); return; }
    member = {id:null, first:'', last:'', phone:'', email:'', accessCode:null, accessStatus:'approved',
      isPlayer: presetRole==='player', player: presetRole==='player'?{dob:'',sex:'Masculin',height:'',weight:'',foot:'Droit',posMain:'Gardien',posSecondary:'',team:'',category:'',testResults:{},stars:0,pres:0,profileComplete:false,injured:false,injuryNote:''}:null,
      isEducator: presetRole==='educator', educator: presetRole==='educator'?{teams:[],role:'Éducateur principal',diplomas:[],diplomaDate:'',trainingNote:''}:null,
      isBoard: presetRole==='board', board: presetRole==='board'?{function:'Président'}:null,
      isReferee: presetRole==='referee', referee: presetRole==='referee'?{matchCount:0}:null,
    };
    mode = 'full';
  }
  S.modal = {type:'member', member, mode};
  renderModal();
}
function toggleRole(role){
  if(S.modal.mode!=='full') return; // seul l'admin peut changer les rôles d'un membre
  const m = S.modal.member;
  const flag = 'is'+role.charAt(0).toUpperCase()+role.slice(1);
  m[flag] = !m[flag];
  if(m[flag] && !m[role]){
    if(role==='player') m.player = {dob:'',sex:'Masculin',height:'',weight:'',foot:'Droit',posMain:'Gardien',posSecondary:'',team:'',category:'',testResults:{},stars:0,pres:0,profileComplete:false,injured:false,injuryNote:''};
    if(role==='educator') m.educator = {teams:[],role:'Éducateur principal',diplomas:[],diplomaDate:'',trainingNote:''};
    if(role==='board') m.board = {function:'Président'};
    if(role==='referee') m.referee = {matchCount:0};
  }
  syncMemberFormToState();
  renderModal();
}
function syncMemberFormToState(){
  const m = S.modal.member; const g = id=>document.getElementById(id);
  if(g('mf-first')) m.first = g('mf-first').value;
  if(g('mf-last')) m.last = g('mf-last').value;
  if(g('mf-phone')) m.phone = g('mf-phone').value;
  if(g('mf-email')) m.email = g('mf-email').value;
  if(m.isPlayer && g('mf-p-dob')){
    m.player.dob=g('mf-p-dob').value; m.player.sex=g('mf-p-sex').value;
    m.player.height=g('mf-p-height').value; m.player.weight=g('mf-p-weight').value;
    m.player.foot=g('mf-p-foot').value; m.player.posMain=g('mf-p-posmain').value; m.player.posSecondary=g('mf-p-possec').value;
    m.player.team=g('mf-p-team').value; m.player.category=g('mf-p-cat')?g('mf-p-cat').value:m.player.category;
    m.player.injured=g('mf-p-injured').checked; m.player.injuryNote=g('mf-p-injnote').value;
    m.player.profileComplete=g('mf-p-complete').checked;
  }
  if(m.isEducator && g('mf-e-role')){

async function saveMemberModal(){
  const mode = S.modal.mode;
  if(mode==='readonly'){ closeModal(); return; }
  syncMemberFormToState();
  const m = S.modal.member;
  if(!m.first.trim() || !m.last.trim()){ toast('Prénom et nom sont obligatoires.'); return; }
  if(!m.isPlayer && !m.isEducator && !m.isBoard && !m.isReferee){ toast('Sélectionnez au moins un rôle.'); return; }
  if(mode!=='full'){ // un membre qui modifie sa propre fiche ne peut pas changer ses accès
    const original = S.db.members.find(x=>x.id===m.id);
    m.accessCode = original.accessCode; m.accessStatus = original.accessStatus;
  }
  if(m.id){
    const idx = S.db.members.findIndex(x=>x.id===m.id);
    S.db.members[idx] = m;
  } else {
    m.id = genId('mem');
    S.db.members.push(m);
  }
  await saveDB();
  closeModal();
  toast('Membre enregistré.');
  go(S.currentKey);
}

  <div class="meta-row" style="display:flex;gap:10px;margin-top:14px;">
    <button class="btn" onclick="saveEventModal()">Enregistrer</button>

async function saveEventModal(){
  const e = S.modal.event;
  if(e.id ? !canEditEvent(e) : !canAddEvent()){ toast('Action non autorisée.'); return; }
  e.type = document.getElementById('ef-type').value;
  if(e.type==='match') e.scope='team';
  const scopeEl = document.getElementById('ef-scope');
  if(scopeEl) e.scope = scopeEl.value;
  const catEl = document.getElementById('ef-cat');
  const teamEl = document.getElementById('ef-team');
  if(e.scope==='category'){ if(catEl) e.category = catEl.value; e.team=''; }
  else { if(teamEl) e.team = teamEl.value; }
  e.date = document.getElementById('ef-date').value;
  e.time = document.getElementById('ef-time').value;
  e.location = document.getElementById('ef-loc').value.trim();
  const oppEl = document.getElementById('ef-opp');
  e.opponent = oppEl ? oppEl.value.trim() : (e.opponent||'');
  if(e.scope==='category'){ if(!e.category){ toast('Choisissez une catégorie.'); return; } }
  else if(!e.team){ toast('Choisissez une équipe.'); return; }
  if(!e.date){ toast('Choisissez une date.'); return; }

  const recurEl = document.getElementById('ef-recur');
  const isWeekly = !!(recurEl && recurEl.value==='weekly' && !e.id);

  if(isWeekly){
    const weeksEl = document.getElementById('ef-weeks');
    const weeks = Math.max(1, parseInt(weeksEl ? weeksEl.value : 12) || 12);
    const groupId = genId('grp');
    const startDate = new Date(e.date+'T12:00:00');
    for(let i=0;i<weeks;i++){
      const d = new Date(startDate); d.setDate(startDate.getDate() + i*7);
      S.db.events.push({
        id: genId('evt'), type:'entrainement', scope: e.scope, team: e.team, category: e.category, date: d.toISOString().slice(0,10), time: e.time,
        location: e.location, opponent:'', score:'', presence:{}, mvpIds:[], behavior:'', note:'', incident:'',
        recurringGroupId: groupId,
      });
    }
    await saveDB(); closeModal(); toast(`${weeks} séances créées (série hebdomadaire).`); go(S.currentKey);
    return;
  }

  if(e.id){ const idx=S.db.events.findIndex(x=>x.id===e.id); S.db.events[idx]=e; }
  else { e.id = genId('evt'); S.db.events.push(e); }
  await saveDB(); closeModal(); toast('Événement enregistré.'); go(S.currentKey);
}

  el.select();
  try{ document.execCommand('copy'); toast('Lien copié.'); }
  catch(e){ toast('Copie manuelle : sélectionnez puis Ctrl+C.'); }
}

boot();
</script>
